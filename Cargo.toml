[package]
name = "superdupe"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "superdupe — the fastest duplicate file finder for Windows / NTFS."
license = "MIT"
repository = "https://github.com/mdreeling/superdupe"
readme = "README.md"
publish = false

[[bin]]
name = "superdupe"
path = "src/main.rs"

[lib]
name = "superdupe"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", features = ["rayon"] }
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
hashbrown = "0.14"
parking_lot = "0.12"
globset = "0.4"
humansize = "2"
csv = "1.3"
bytes = "1.6"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_UI_Shell",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
