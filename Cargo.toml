[package]
name = "superdeduper"
version = "0.2.11"
edition = "2021"
rust-version = "1.87"
description = "superdeduper — the fastest duplicate file finder for Windows / NTFS."
license = "MIT"
repository = "https://github.com/mickfixesjunk/superdeduper"
readme = "README.md"
publish = false

[[bin]]
name = "superdeduper"
path = "src/main.rs"

[lib]
name = "superdeduper"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", features = ["rayon"] }
# river5 lives in its own repo. Pinned by rev so CI builds are
# reproducible — bump the SHA when river5 ships AES-NI v2 or any
# other ABI-affecting change. For local iteration against an
# unpushed working copy, add to a (gitignored) `.cargo/config.toml`:
#   [patch."https://github.com/mickfixesjunk/river5"]
#   river5 = { path = "../river5" }
river5 = { git = "https://github.com/mickfixesjunk/river5", rev = "35533ced58c0c29f28726fdd355ace8d51c28e8b" }
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
hashbrown = "0.14"
parking_lot = "0.12"
globset = "0.4"
humansize = "2"
csv = "1.3"
bytes = "1.6"
# TOML serde for sd's persisted config (project bundle, exclusions
# settings, etc.). `toml` is the de facto Rust TOML crate.
toml = "0.8"
# SHA-256 used by `sd debug snapshot` (content/ACL hashes per the
# containment-test schema) and by the telemetry HMAC signer. Small
# audited RustCrypto crate; non-optional so the debug helper
# compiles in `--no-default-features` builds.
sha2 = "0.10"

# GUI deps — optional, gated behind the `gui` feature.
eframe = { version = "0.32", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.32", optional = true }
egui_plot = { version = "0.33", optional = true }
egui_extras = { version = "0.32", optional = true, features = ["all_loaders"] }
crossbeam-channel = { version = "0.5", optional = true }
rfd = { version = "0.14", optional = true }
rodio = { version = "0.19", optional = true, default-features = false }

# G-track (gamification + leaderboards) deps — optional, gated
# behind the `telemetry` feature. Default-on in release builds;
# distros / paranoid users can build with --no-default-features to
# strip the network + crypto code paths entirely.
#
# * ureq: blocking HTTP client. Single-dep blast radius; no tokio.
# * hmac + sha2: RustCrypto, audited, no_std. HMAC-SHA256 signing.
# * uuid: install_id generation; the existing telemetry::new_run_uuid
#   helper is xorshift-based and fine for idempotency keys, but
#   install_id wants a real RFC 4122 v4 UUID per client-spec §4.3.
ureq = { version = "2.10", optional = true, default-features = false, features = ["json", "tls"] }
hmac = { version = "0.12", optional = true }
uuid = { version = "1.10", optional = true, features = ["v4"] }
# Unicode script detection — used by the `polyglot-paths` predicate
# (gamification §5) to count distinct scripts in a path. Tiny crate,
# data-table only, no other deps.
unicode-script = { version = "0.5", optional = true }

# T1.2 perceptual image similarity (#25). `image` decodes JPEG / PNG /
# WebP / GIF / BMP / TIFF / ICO; `image_hasher` provides the dHash /
# aHash / pHash family that operates on a decoded image. Both gated
# behind the `similar-images` cargo feature so the always-on dedup
# pipeline doesn't pull image-codec deps it doesn't need. HEIC isn't
# in the `image` crate yet (per spec §3.4); revisit if user demand
# surfaces.
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico"] }
image_hasher = { version = "3", optional = true }

# T1.3 acoustic audio similarity (#26). `symphonia` decodes the
# common audio formats; `rusty-chromaprint` produces the 32-bit
# fingerprint chunks the AcoustID ecosystem uses. Both behind the
# `similar-audio` cargo feature so audio codecs aren't pulled into
# the always-on dedup path. symphonia's full codec stack is
# significant; we enable the codec features matching spec §3
# (mp3, aac, flac, wav, ogg-vorbis, opus, plus the matching
# containers).
symphonia = { version = "0.5", optional = true, default-features = false, features = ["mp3", "aac", "flac", "wav", "vorbis", "ogg", "isomp4"] }
rusty-chromaprint = { version = "0.3", optional = true }

[features]
default = []
# Rendering + interaction stack. Does NOT pull rodio — see `audio`.
# Splitting these lets the test/CI matrix run gui-feature checks on
# Linux without needing libasound2-dev (rodio's transitive build dep).
gui = ["dep:eframe", "dep:egui", "dep:egui_plot", "dep:egui_extras", "dep:crossbeam-channel", "dep:rfd"]
# Sound-effect playback (the scan-done chime). Independent of gui so
# headless builds could in principle play notifications too, though
# in practice this is GUI-only. Release builds combine both:
# `--features "gui audio"`.
audio = ["dep:rodio"]
# G-track leaderboards + achievements. Pulls the HMAC + ureq stack
# so the engine can register + sign + submit. Off by default until
# G1 lands and the release matrix turns it on.
telemetry = ["dep:ureq", "dep:hmac", "dep:uuid", "dep:unicode-script"]
# T1.2 perceptual image similarity (#25). Pulls `image` for decode
# + `image_hasher` for the dHash/aHash/pHash family. Off by default
# while the feature lands incrementally — first slice is just the
# algorithm wrapper module + `--mode image` CLI flag, no pipeline
# integration yet. Release matrix will turn it on once Tier-4
# integration ships per the spec.
similar-images = ["dep:image", "dep:image_hasher"]
# T1.3 acoustic audio similarity (#26). Pulls `symphonia` for
# cross-codec audio decoding (MP3, M4A, AAC, FLAC, WAV, OGG, OPUS,
# WMA) + `rusty-chromaprint` for fingerprinting. Off by default;
# release matrix flips it on alongside Tier-4 audio integration.
# Initial slice: algorithm wrapper module + `--mode audio`
# CLI flag (already in place from #25 v1), no pipeline
# integration yet.
similar-audio = ["dep:symphonia", "dep:rusty-chromaprint"]

[[bin]]
name = "superdeduper-gui"
path = "src/bin/superdeduper_gui.rs"
required-features = ["gui"]

[[bin]]
name = "superdeduper-hash-repro"
path = "src/bin/hash_repro.rs"

[[bin]]
name = "superdeduper-dir-probe"
path = "src/bin/dir_probe.rs"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_UI_Shell",
    # G1 captcha browser-open uses ShellExecuteW (avoids `cmd /c start`
    # mangling URLs that contain `&`) + SW_SHOWNORMAL from this module.
    "Win32_UI_WindowsAndMessaging",
    # T2.3 — IFileOperation upgrade. The COM-based replacement for
    # SHFileOperationW needs CoInitializeEx / CoUninitialize plus the
    # SHCreateItemFromParsingName/IShellItem family.
    "Win32_System_Com",
]

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"
# Headless egui harness for widget-render tests (see docs/testing/gui.md).
# Tracks egui 0.32; bump in lockstep with the main egui pin. The `wgpu`
# + `snapshot` features enable PNG-rendering for the side-artifact
# Mick + design asked for.
egui_kittest = { version = "0.32", features = ["wgpu", "snapshot"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
