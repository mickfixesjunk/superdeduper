[package]
name = "superdupe"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "superdupe — the fastest duplicate file finder for Windows / NTFS."
license = "MIT"
repository = "https://github.com/mdreeling/superdupe"
readme = "README.md"
publish = false

[[bin]]
name = "superdupe"
path = "src/main.rs"

[lib]
name = "superdupe"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", features = ["rayon"] }
# river5 lives in its own repo. Pinned by rev so CI builds are
# reproducible — bump the SHA when river5 ships AES-NI v2 or any
# other ABI-affecting change. For local iteration against an
# unpushed working copy, add to a (gitignored) `.cargo/config.toml`:
#   [patch."https://github.com/mdreeling/river5"]
#   river5 = { path = "../river5" }
river5 = { git = "https://github.com/mdreeling/river5", rev = "c527ff8c76f7345aca4cd875293f9bbcda285f5c" }
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
hashbrown = "0.14"
parking_lot = "0.12"
globset = "0.4"
humansize = "2"
csv = "1.3"
bytes = "1.6"

# GUI deps — optional, gated behind the `gui` feature.
eframe = { version = "0.28", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
egui = { version = "0.28", optional = true }
egui_plot = { version = "0.28", optional = true }
egui_extras = { version = "0.28", optional = true, features = ["all_loaders"] }
crossbeam-channel = { version = "0.5", optional = true }
rfd = { version = "0.14", optional = true }

[features]
default = []
gui = ["dep:eframe", "dep:egui", "dep:egui_plot", "dep:egui_extras", "dep:crossbeam-channel", "dep:rfd"]

[[bin]]
name = "superdupe-gui"
path = "src/bin/superdupe_gui.rs"
required-features = ["gui"]

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_UI_Shell",
]

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
