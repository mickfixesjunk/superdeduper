[package]
name = "superdeduper-bench-iface"
version = "0.1.0"
edition = "2021"
description = "Phase 0 leaf crate: BenchExecutor + SubmissionExecutor traits + BenchError enum + shared types. Defines the iface boundary between engine and the future bench-real / bench-stub crates so the cut-line can be validated in code (Phase 0) before moving leaderboard internals behind it (Phase 1+)."
license = "MIT"
repository = "https://github.com/mickfixesjunk/superdeduper"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# schemars derives JSON Schema for wire types (HardwareFingerprint;
# RunShape + ResultSummary follow in Phase 2-B). Optional + gated
# behind `telemetry` so closed-source / minimal-deps build paths
# don't pull it in. Engine forwards its own `telemetry` feature.
schemars = { version = "0.8", optional = true }

[features]
default = []
# Activates JsonSchema derives on the wire types. Engine forwards
# `telemetry` here so the schema-derivation CI test (the
# schema/submit.schema.json regen guard) keeps working post-move.
telemetry = ["dep:schemars"]
