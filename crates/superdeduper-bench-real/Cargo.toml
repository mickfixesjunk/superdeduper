[package]
name = "superdeduper-bench-real"
version = "0.1.0"
edition = "2021"
description = "Phase 0 trait extraction default impl: superdeduper-bench-real holds the real bench-flow + submission logic moved out of the engine binary's src/leaderboard/. Implements BenchExecutor + SubmissionExecutor from superdeduper-bench-iface. Phase 1 (2026-05-31): scaffold + d7_probe module move + BenchReal stub impls. Phase 2 (post-launch): the remaining 5 modules + real trait method bodies."
license = "MIT"
repository = "https://github.com/mickfixesjunk/superdeduper"
publish = false

[dependencies]
# Phase 1 deps: d7_probe + BenchReal stub + bench (chacha20 + blake3 for
# the Merkle math) + bench_corpus (serde + bench).
# Phase 2-B 2026-06-01: bench_client.rs move pulls in serde_json (the
# canonical-bench bench_proof field is a Value; to_canonical_bench
# uses json!() macro).
superdeduper-bench-iface = { path = "../superdeduper-bench-iface" }
superdeduper-hmac-signer = { path = "../superdeduper-hmac-signer" }
superdeduper-log = { path = "../superdeduper-log" }
blake3 = "1"
chacha20 = "0.9"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
# Phase 2-B body-move 2026-06-01: bench_run.rs adds anyhow + ureq (HTTP
# /bench/start + /dedup-ready) + uuid (run_uuid) + tar (corpus archive
# extraction) + rayon (parallel hash passes).
anyhow = "1"
ureq = { version = "2.10", default-features = false, features = ["json", "tls"] }
uuid = { version = "1.10", features = ["v4"] }
tar = "0.4"
rayon = "1.10"

[target.'cfg(unix)'.dependencies]
# Phase 2-B body-move 2026-06-01: bench_run.rs read_uncached/evict_*
# helpers call libc directly for O_DIRECT/posix_fadvise on Linux +
# F_NOCACHE on macOS.
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
# Phase 2-B body-move 2026-06-01: bench_run.rs read_uncached uses
# CreateFileW with FILE_FLAG_NO_BUFFERING + FILE_FLAG_WRITE_THROUGH;
# page-eviction calls SetFileInformationByHandle. Mirror the engine
# binary's windows-0.58 + feature set (same crate version forces a
# single resolution).
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
]

[dev-dependencies]
# Test-only deps used by the moved bench_corpus + bench tests
# (rayon for the parallel manifest gen tests; serde_json for the
# canonical-JSON round-trip assertions).
serde_json = "1"
tempfile = "3"
