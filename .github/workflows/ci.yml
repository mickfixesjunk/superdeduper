name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # `-D warnings` was here but tripped on the 40+ egui 0.32
  # deprecation warnings since the 0.28→0.32 upgrade. Keeping
  # main green over cleaning each warning by hand is the
  # pragmatic call until the deprecation backlog gets a dedicated
  # pass. The clippy job's per-step `-- -D warnings` still
  # catches NEW lints introduced by changed code.

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Lint the default-feature surface first, then the gui-feature
      # surface so gui-specific clippy lints get caught here too. We
      # do NOT enable `audio` because that pulls alsa-sys → needs
      # libasound2-dev on the runner; the Windows job covers gui+audio.
      #
      # `-D warnings` catches NEW lints introduced by changed code AND
      # NEW deprecations (the egui 0.32 deprecation backlog was cleaned
      # up in #21; any future deprecation pass should be done before
      # merging the upgrade so this gate doesn't go red).
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features gui -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Re-run with `--features gui` so the resumability tests (which
      # live under that feature gate because they test GUI checkpoint
      # code) actually execute. Same alsa-sys avoidance as the clippy
      # step — `audio` not enabled here.
      - run: cargo test --workspace --locked --features gui

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Microsoft-hosted windows-latest runners ship with Defender
      # real-time scanning ON. The property tests create up to
      # ~25 small files per case × 32 cases × 2 parallel test
      # binaries — Defender intercepts every open/write/close,
      # which can push the job from seconds to 20+ minutes (the
      # symptom looks like a hang).
      #
      # Two layered fixes:
      #   1. Add workspace + TEMP folders as Defender exclusions
      #      so writes inside cargo's `tempfile::TempDir` don't
      #      get scanned.
      #   2. Force `--test-threads=1` so the two proptest binaries
      #      don't compete for I/O.
      - name: Disable Defender scanning of workspace + TEMP
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
            Add-MpPreference -ExclusionPath "$env:TEMP"
            Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
            Write-Host "Defender exclusions added."
          } catch {
            Write-Host "::warning::Could not add Defender exclusions: $_"
          }
      # Run unit tests + smoke; skip the proptest-driven `properties`
      # binary on Windows. The property tests verify the algorithm
      # (hashing / size grouping / layout / dedup invariants) which
      # is OS-agnostic — Linux CI already covers them. On Windows
      # each test case opens up to ~25 files with
      # FSCTL_GET_RETRIEVAL_POINTERS, and the runner's I/O subsystem
      # turns 32 cases × 3 tests into a 20+ minute run even with
      # Defender exclusions. The Windows-specific surface area (MFT
      # enum, USN journal, IOCTL wrappers) has dedicated unit tests
      # in src/winapi_wrappers/windows_impl.rs that DO run here.
      - run: cargo test --workspace --locked --lib --bins -- --test-threads=1
      - run: cargo test --workspace --locked --test smoke -- --test-threads=1
      # One `cargo build` call so cargo compiles shared deps (egui's
      # dep tree is huge but most of it is also used by the CLI's
      # tracing/serde graph; building both bins together lets cargo
      # share the codegen instead of duplicating per-bin work). Previous
      # two-step shape took ~7 minutes for GUI + ~1 minute for CLI;
      # the combined build typically lands closer to ~7 minutes total.
      - run: cargo build --release --locked --features "gui audio" --bin superdeduper --bin superdeduper-gui
      # Upload the built EXEs as a workflow artifact on every push to
      # main so we can iterate without cutting a tagged release. The
      # bundle lives under the run's Artifacts section for 14 days.
      - name: Stage artifacts
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $stage = "ci-build"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/superdeduper.exe $stage/
          Copy-Item target/release/superdeduper-gui.exe $stage/
          Copy-Item LICENSE $stage/
          Copy-Item README.md $stage/
          $files = @(Get-ChildItem $stage -File | Where-Object { $_.Name -ne 'SHA256SUMS' })
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii -Path "$stage/SHA256SUMS"
          Get-Content "$stage/SHA256SUMS"
      - name: Upload Windows build
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: superdeduper-windows-${{ github.sha }}
          path: ci-build/**
          if-no-files-found: error
          retention-days: 14
