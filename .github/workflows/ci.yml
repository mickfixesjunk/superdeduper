name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Microsoft-hosted windows-latest runners ship with Defender
      # real-time scanning ON. The property tests create up to
      # ~25 small files per case × 32 cases × 2 parallel test
      # binaries — Defender intercepts every open/write/close,
      # which can push the job from seconds to 20+ minutes (the
      # symptom looks like a hang).
      #
      # Two layered fixes:
      #   1. Add workspace + TEMP folders as Defender exclusions
      #      so writes inside cargo's `tempfile::TempDir` don't
      #      get scanned.
      #   2. Force `--test-threads=1` so the two proptest binaries
      #      don't compete for I/O.
      - name: Disable Defender scanning of workspace + TEMP
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
            Add-MpPreference -ExclusionPath "$env:TEMP"
            Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
            Write-Host "Defender exclusions added."
          } catch {
            Write-Host "::warning::Could not add Defender exclusions: $_"
          }
      # Run unit tests + smoke; skip the proptest-driven `properties`
      # binary on Windows. The property tests verify the algorithm
      # (hashing / size grouping / layout / dedup invariants) which
      # is OS-agnostic — Linux CI already covers them. On Windows
      # each test case opens up to ~25 files with
      # FSCTL_GET_RETRIEVAL_POINTERS, and the runner's I/O subsystem
      # turns 32 cases × 3 tests into a 20+ minute run even with
      # Defender exclusions. The Windows-specific surface area (MFT
      # enum, USN journal, IOCTL wrappers) has dedicated unit tests
      # in src/winapi_wrappers/windows_impl.rs that DO run here.
      - run: cargo test --workspace --locked --lib --bins -- --test-threads=1
      - run: cargo test --workspace --locked --test smoke -- --test-threads=1
      # One `cargo build` call so cargo compiles shared deps (egui's
      # dep tree is huge but most of it is also used by the CLI's
      # tracing/serde graph; building both bins together lets cargo
      # share the codegen instead of duplicating per-bin work). Previous
      # two-step shape took ~7 minutes for GUI + ~1 minute for CLI;
      # the combined build typically lands closer to ~7 minutes total.
      - run: cargo build --release --locked --features gui --bin superdupe --bin superdupe-gui
      # Upload the built EXEs as a workflow artifact on every push to
      # main so we can iterate without cutting a tagged release. The
      # bundle lives under the run's Artifacts section for 14 days.
      - name: Stage artifacts
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $stage = "ci-build"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/release/superdupe.exe $stage/
          Copy-Item target/release/superdupe-gui.exe $stage/
          Copy-Item LICENSE $stage/
          Copy-Item README.md $stage/
          $files = @(Get-ChildItem $stage -File | Where-Object { $_.Name -ne 'SHA256SUMS' })
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii -Path "$stage/SHA256SUMS"
          Get-Content "$stage/SHA256SUMS"
      - name: Upload Windows build
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: superdupe-windows-${{ github.sha }}
          path: ci-build/**
          if-no-files-found: error
          retention-days: 14
