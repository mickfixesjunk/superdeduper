name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

# Required for Sigstore-backed artifact attestations. These OIDC scopes
# let the runner mint a short-lived signing key that proves the binary
# came from THIS workflow at THIS commit. Anyone can later verify the
# attestation against the public Sigstore log — no shared secrets, no
# trust in a private key.
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  # NOTE: deliberately NOT setting `RUSTFLAGS: -D warnings` here.
  # release.yml had been failing since v0.1.5 because the
  # egui 0.28 → 0.32 upgrade introduced 40+ deprecation warnings;
  # the deny-warnings flag turned every release tag into a red
  # build. Warnings stay surfaced in `ci.yml` (which runs on
  # branches + PRs); tagged releases ship binaries even when
  # the deprecation backlog isn't fully cleaned up.

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # `VERSION_TAG` ends up baked into every artifact filename
    # (`superdeduper-v0.2.0-windows-x86_64.zip`). On tag pushes
    # `github.ref_name` is the tag (`v0.2.0`); on manual
    # workflow_dispatch the caller supplies it as an input. Spec ref:
    # GH issue #11.
    env:
      VERSION_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          # aarch64-pc-windows-msvc temporarily removed: the river5
          # crate's AES-NI C source uses x86-only intrinsics
          # (`__m128i`, `_mm_aesenc_si128`) which the ARM64 MSVC
          # compiler can't build. Tracked separately (river5 needs
          # an aarch64 SIMD fallback or arch-conditional cc-rs
          # config). Re-add this matrix entry once river5 ships a
          # build that compiles cleanly on aarch64.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (locked, release)
        shell: pwsh
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin superdeduper
          cargo build --release --locked --target ${{ matrix.target }} --features "gui audio" --bin superdeduper-gui

      - name: Stage artifacts
        shell: pwsh
        run: |
          $stage = "stage/superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/superdeduper.exe $stage/
          Copy-Item target/${{ matrix.target }}/release/superdeduper-gui.exe $stage/
          Copy-Item LICENSE $stage/
          Copy-Item README.md $stage/

      - name: Authenticode sign (if cert available)
        # Skipped automatically when secrets aren't configured (forks,
        # PR builds). Maintainer set CODE_SIGN_PFX_BASE64 + PFX_PASSWORD
        # in repo secrets to enable. Use signtool's /tr timestamping so
        # signatures remain valid after the cert expires.
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $stage = "stage/superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}"
          & $signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
            /tr "http://timestamp.digicert.com" /td SHA256 `
            "$stage\superdeduper.exe" "$stage\superdeduper-gui.exe"
          & $signtool verify /pa "$stage\superdeduper.exe"
          & $signtool verify /pa "$stage\superdeduper-gui.exe"
          Remove-Item $pfx

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          # Materialise the file list eagerly so the pipeline doesn't
          # try to hash SHA256SUMS itself while Out-File still holds
          # the write handle.
          $stage = "stage/superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}"
          $files = @(Get-ChildItem $stage -File | Where-Object { $_.Name -ne 'SHA256SUMS' })
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii -Path "$stage/SHA256SUMS"
          Get-Content "$stage/SHA256SUMS"

      - name: Zip artifact
        # Per-file `.zip.sha256` sidecar was retired in #11. Tarball /
        # zip integrity now flows through the canonical SHA256SUMS
        # produced by the `checksums` finalize job below — one
        # file at the release root covering every uploaded artifact.
        shell: pwsh
        run: |
          $stage = "stage/superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}"
          Compress-Archive -Path "$stage/*" -DestinationPath "superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}.zip"

      # Sigstore-backed attestation. Proves these specific bytes came
      # from this commit on this workflow run, signed by GitHub's OIDC
      # identity. Verifiable with `gh attestation verify` — no shared
      # secret required and no risk of key compromise.
      #
      # GitHub limits attestations to PUBLIC repos and ORG-owned
      # private repos. User-owned private repos return:
      #   "Feature not available for user-owned private repositories."
      # We gate the step on visibility so private-repo runs don't show
      # a red square, and additionally `continue-on-error: true` keeps
      # the release upload running even if attestation hiccups for
      # some other reason. Once the repo is made public (or moved into
      # an org), this step starts persisting attestations automatically.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility != 'private' || github.event.repository.owner.type == 'Organization' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}.zip

  build-linux:
    # Linux side of the release. Kept as a separate job (rather than
    # folded into the matrix above) because every step on the Windows
    # path uses pwsh + signtool + Compress-Archive — the diff to make
    # them shell-agnostic would dwarf the duplication.
    name: build (linux-x86_64)
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl + build deps
        # musl-tools provides the musl-gcc wrapper that some -sys
        # crates (rusqlite, alsa-sys) need for their build.rs to
        # link statically. libasound2-dev still needed when the
        # `audio` feature pulls rodio → alsa-sys.
        run: sudo apt-get update && sudo apt-get install -y musl-tools libasound2-dev pkg-config

      - name: Build (locked, release, musl-static)
        # Static-link against musl libc so the produced binaries
        # have no glibc dependency at runtime. Ships on any Linux
        # 3.2+ kernel (Ubuntu 16.04 onward, RHEL/CentOS 7+). The
        # `audio` feature is intentionally omitted on Linux release
        # builds — alsa-sys pulls a libc binding that doesn't
        # static-link clean against musl in practice; CLI + GUI
        # ship without the scan-done chime on Linux.
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl --bin superdeduper
          cargo build --release --locked --target x86_64-unknown-linux-musl --features "gui" --bin superdeduper-gui

      - name: Stage artifacts
        run: |
          stage="stage/superdeduper-${VERSION_TAG}-linux-x86_64"
          mkdir -p "$stage"
          cp target/x86_64-unknown-linux-musl/release/superdeduper "$stage/"
          cp target/x86_64-unknown-linux-musl/release/superdeduper-gui "$stage/"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          # Ensure executable bit is set even after tarball extract.
          chmod +x "$stage/superdeduper" "$stage/superdeduper-gui"
          # Strip debug symbols — drops the binary size meaningfully
          # without losing crash-report value (Rust's std panic
          # handler still reports the panic site by source location).
          strip "$stage/superdeduper" "$stage/superdeduper-gui" || true
          # Verify musl-static: no GLIBC_ symbols should remain.
          if objdump -T "$stage/superdeduper-gui" 2>/dev/null | grep -q GLIBC_; then
            echo "::error::superdeduper-gui still references GLIBC_ symbols"
            objdump -T "$stage/superdeduper-gui" | grep GLIBC_
            exit 1
          fi

      - name: Compute inside-tarball SHA-256 checksums
        # Side-channel SHA file lives INSIDE the tarball so a consumer
        # who extracts can verify the binaries match the recorded
        # hashes. Top-level integrity (zip/tarball against tampering)
        # is covered by the `checksums` finalize job's release-root
        # SHA256SUMS — this one is for post-extract integrity.
        run: |
          stage="stage/superdeduper-${VERSION_TAG}-linux-x86_64"
          ( cd "$stage" && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - name: Tar artifact
        # `.tar.gz` matches the typical Linux release shape; doesn't
        # need the Compress-Archive PowerShell shenanigans the Windows
        # job has to do. Per-file `.tar.gz.sha256` sidecar was retired
        # in #11 — see Windows job's `Zip artifact` step comment.
        run: |
          tar -czf "superdeduper-${VERSION_TAG}-linux-x86_64.tar.gz" \
            -C stage "superdeduper-${VERSION_TAG}-linux-x86_64"

      - name: Attest build provenance
        if: ${{ github.event.repository.visibility != 'private' || github.event.repository.owner.type == 'Organization' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            superdeduper-${{ env.VERSION_TAG }}-linux-x86_64.tar.gz

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            superdeduper-${{ env.VERSION_TAG }}-linux-x86_64.tar.gz

  build-macos:
    # macOS side of the release. Separate job so the two arches
    # (Intel x86_64 + Apple Silicon aarch64) build in parallel on
    # macos-latest. macos-latest is an Apple Silicon (M-series)
    # runner — it builds aarch64-apple-darwin natively + cross-builds
    # x86_64-apple-darwin via the toolchain's built-in support for
    # both Darwin targets (Apple stdlib is fat-binary-friendly).
    #
    # Binaries ship UNSIGNED for v0.2.x. Users will see Gatekeeper's
    # "unidentified developer" warning on first launch; right-click →
    # Open is the workaround. Code-signing + notarisation needs an
    # Apple Developer Program account ($99/yr) and lives behind a
    # separate L1 sub-deliverable per platforms-roadmap.md §L1.
    name: build (${{ matrix.target }})
    runs-on: macos-latest
    env:
      VERSION_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: macos-aarch64
          - target: x86_64-apple-darwin
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (locked, release)
        # No external system-deps needed — the macOS SDK on
        # macos-latest provides libSystem + frameworks. `audio`
        # feature is OFF for the same reason it's off on Linux:
        # rodio's alsa-sys dep doesn't play with cross-target
        # builds cleanly. Cross-platform scan-done chime is a
        # follow-up.
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin superdeduper
          cargo build --release --locked --target ${{ matrix.target }} --features "gui" --bin superdeduper-gui

      - name: Stage artifacts
        run: |
          stage="stage/superdeduper-${VERSION_TAG}-${{ matrix.platform }}"
          mkdir -p "$stage"
          cp target/${{ matrix.target }}/release/superdeduper "$stage/"
          cp target/${{ matrix.target }}/release/superdeduper-gui "$stage/"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          chmod +x "$stage/superdeduper" "$stage/superdeduper-gui"
          # macOS `strip` works the same as Linux for the symbol-table
          # parts we care about. `-x` strips local symbols only,
          # keeping the global table that crash reporters need.
          strip -x "$stage/superdeduper" "$stage/superdeduper-gui" || true

      - name: Compute inside-tarball SHA-256 checksums
        # macOS's `shasum -a 256` produces the same format as Linux's
        # `sha256sum`, so the inside-tarball SHA256SUMS file matches
        # the cross-platform pattern used by build-linux.
        run: |
          stage="stage/superdeduper-${VERSION_TAG}-${{ matrix.platform }}"
          ( cd "$stage" && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS )

      - name: Tar artifact
        run: |
          tar -czf "superdeduper-${VERSION_TAG}-${{ matrix.platform }}.tar.gz" \
            -C stage "superdeduper-${VERSION_TAG}-${{ matrix.platform }}"

      - name: Attest build provenance
        if: ${{ github.event.repository.visibility != 'private' || github.event.repository.owner.type == 'Organization' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}.tar.gz

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            superdeduper-${{ env.VERSION_TAG }}-${{ matrix.platform }}.tar.gz

  checksums:
    # Finalize job that computes the canonical release-root
    # SHA256SUMS file. Runs after every build leg finishes so it
    # can download all uploaded zips + tarballs from the draft
    # release, hash them, and re-upload SHA256SUMS to the same
    # draft. Per #11 spec, one canonical file at the release root
    # is the source-of-truth for download-integrity verification.
    name: checksums
    needs: [build, build-linux, build-macos]
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Download artifacts from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `gh release download` against a draft release works as
        # long as the token has `contents: write` on this repo —
        # softprops/action-gh-release uploads land on the draft
        # the moment each build job finishes, so by the time the
        # `needs:` gate releases this job, all per-platform
        # artifacts are already attached and downloadable.
        run: |
          mkdir -p release-files
          gh release download "$VERSION_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "superdeduper-${VERSION_TAG}-*.zip" \
            --pattern "superdeduper-${VERSION_TAG}-*.tar.gz" \
            --dir release-files
          ls -la release-files

      - name: Compute canonical SHA256SUMS
        run: |
          cd release-files
          # `sha256sum *.zip *.tar.gz` keeps a stable order across runs:
          # zips first then tarballs, lexically within each group. The
          # consumer-facing format (`<hash>  <filename>`) matches what
          # `sha256sum -c SHA256SUMS` expects.
          sha256sum *.zip *.tar.gz 2>/dev/null > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: false
          files: |
            release-files/SHA256SUMS
