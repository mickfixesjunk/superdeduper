name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

# Required for Sigstore-backed artifact attestations. These OIDC scopes
# let the runner mint a short-lived signing key that proves the binary
# came from THIS workflow at THIS commit. Anyone can later verify the
# attestation against the public Sigstore log — no shared secrets, no
# trust in a private key.
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: superdeduper-x86_64-windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: superdeduper-aarch64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build (locked, release)
        shell: pwsh
        run: |
          cargo build --release --locked --target ${{ matrix.target }} --bin superdeduper
          cargo build --release --locked --target ${{ matrix.target }} --features "gui audio" --bin superdeduper-gui

      - name: Stage artifacts
        shell: pwsh
        run: |
          $stage = "stage/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/superdeduper.exe $stage/
          Copy-Item target/${{ matrix.target }}/release/superdeduper-gui.exe $stage/
          Copy-Item LICENSE $stage/
          Copy-Item README.md $stage/

      - name: Authenticode sign (if cert available)
        # Skipped automatically when secrets aren't configured (forks,
        # PR builds). Maintainer set CODE_SIGN_PFX_BASE64 + PFX_PASSWORD
        # in repo secrets to enable. Use signtool's /tr timestamping so
        # signatures remain valid after the cert expires.
        if: ${{ env.CODE_SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                       Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $stage = "stage/${{ matrix.artifact }}"
          & $signtool sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
            /tr "http://timestamp.digicert.com" /td SHA256 `
            "$stage\superdeduper.exe" "$stage\superdeduper-gui.exe"
          & $signtool verify /pa "$stage\superdeduper.exe"
          & $signtool verify /pa "$stage\superdeduper-gui.exe"
          Remove-Item $pfx

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          # Materialise the file list eagerly so the pipeline doesn't
          # try to hash SHA256SUMS itself while Out-File still holds
          # the write handle.
          $stage = "stage/${{ matrix.artifact }}"
          $files = @(Get-ChildItem $stage -File | Where-Object { $_.Name -ne 'SHA256SUMS' })
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content -Encoding ascii -Path "$stage/SHA256SUMS"
          Get-Content "$stage/SHA256SUMS"

      - name: Zip artifact
        shell: pwsh
        run: |
          $stage = "stage/${{ matrix.artifact }}"
          Compress-Archive -Path "$stage/*" -DestinationPath "${{ matrix.artifact }}.zip"
          (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}.zip").Hash.ToLower() + "  ${{ matrix.artifact }}.zip" `
            | Out-File -Encoding ascii "${{ matrix.artifact }}.zip.sha256"

      # Sigstore-backed attestation. Proves these specific bytes came
      # from this commit on this workflow run, signed by GitHub's OIDC
      # identity. Verifiable with `gh attestation verify` — no shared
      # secret required and no risk of key compromise.
      #
      # GitHub limits attestations to PUBLIC repos and ORG-owned
      # private repos. User-owned private repos return:
      #   "Feature not available for user-owned private repositories."
      # We gate the step on visibility so private-repo runs don't show
      # a red square, and additionally `continue-on-error: true` keeps
      # the release upload running even if attestation hiccups for
      # some other reason. Once the repo is made public (or moved into
      # an org), this step starts persisting attestations automatically.
      - name: Attest build provenance
        if: ${{ github.event.repository.visibility != 'private' || github.event.repository.owner.type == 'Organization' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  build-linux:
    # Linux side of the release. Kept as a separate job (rather than
    # folded into the matrix above) because every step on the Windows
    # path uses pwsh + signtool + Compress-Archive — the diff to make
    # them shell-agnostic would dwarf the duplication.
    name: build (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Install GUI build deps
        # libasound2-dev is required by alsa-sys, which rodio pulls
        # in for the scan-done chime. CLI-only builds don't need it
        # — but we ship both CLI + GUI so we install it unconditionally.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Build (locked, release)
        run: |
          cargo build --release --locked --bin superdeduper
          cargo build --release --locked --features "gui audio" --bin superdeduper-gui

      - name: Stage artifacts
        run: |
          stage="stage/superdeduper-x86_64-linux"
          mkdir -p "$stage"
          cp target/release/superdeduper "$stage/"
          cp target/release/superdeduper-gui "$stage/"
          cp LICENSE "$stage/"
          cp README.md "$stage/"
          # Strip debug symbols — drops the binary size meaningfully
          # without losing crash-report value (Rust's std panic
          # handler still reports the panic site by source location).
          strip "$stage/superdeduper" "$stage/superdeduper-gui" || true

      - name: Compute SHA-256 checksums
        run: |
          stage="stage/superdeduper-x86_64-linux"
          ( cd "$stage" && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - name: Tar artifact
        # `.tar.gz` matches the typical Linux release shape; doesn't
        # need the Compress-Archive PowerShell shenanigans the Windows
        # job has to do. SHA hash of the tarball goes alongside so a
        # consumer can verify integrity without extracting.
        run: |
          tar -czf superdeduper-x86_64-linux.tar.gz -C stage superdeduper-x86_64-linux
          sha256sum superdeduper-x86_64-linux.tar.gz | tee superdeduper-x86_64-linux.tar.gz.sha256

      - name: Attest build provenance
        if: ${{ github.event.repository.visibility != 'private' || github.event.repository.owner.type == 'Organization' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            superdeduper-x86_64-linux.tar.gz
            superdeduper-x86_64-linux.tar.gz.sha256

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            superdeduper-x86_64-linux.tar.gz
            superdeduper-x86_64-linux.tar.gz.sha256
